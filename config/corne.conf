# Corne configuration

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice-oled: левая (central) = "лестница слоёв" (буква базы, слои, модификаторы, подключение, батарея),
#            правая (peripheral) = анимация кота
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_LAYER_LADDER=y
CONFIG_NICE_OLED_WIDGET_WPM=n
# правая: Bongo Cat, реагирует на нажатия правой половины
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_PERIPHERAL_BONGO_CAT=y

# Debounce settings
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Bluetooth power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="VTwin"

# BLE Security/Pairing
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=n

# BLE connection parameters (aggressive for 150+ WPM)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=300

# Внешнее питание. Клавиши EP нет: сохранённое состояние OFF отключает экран при старте.
CONFIG_ZMK_EXT_POWER=y

# Mouse / Pointing
CONFIG_ZMK_POINTING=y

# RGB выключен при старте; включается клавишей RGB_TOG на слое Adjust
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Per-key per-layer RGB (darknao fork feature)
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100

# Sleep / Idle
# Глубокий сон выключен (тест: зависания после простоя). Обычный idle остаётся.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Display
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# LVGL 9 needs a bigger stack for the display thread (nice_oled PR #37 notes a hard fault at 2560)
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096


# Связь между половинами: latency 0, чтобы правая половина слушала левую на каждом интервале (7.5 мс),
# а не спала до 30 интервалов (≈225 мс). Команды слоя/подсветки доходят без задержки. Цена: батарея правой.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
